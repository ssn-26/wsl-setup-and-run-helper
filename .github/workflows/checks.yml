# Fast checks on every push and pull request. They catch the mistakes that
# otherwise only show up when someone double-clicks the panel on Windows.
name: Checks

on:
  push:
  pull_request:

jobs:
  bash:
    name: Bash scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings and errors fail the build; info/style notes (which differ
      # between shellcheck versions) are only shown.
      - name: shellcheck
        run: |
          shellcheck bash/*.sh || true
          shellcheck --severity=warning bash/*.sh
          shellcheck --severity=warning -s sh bash/xsession

      - name: LF line endings in bash/
        run: |
          if grep -rlI $'\r' bash/; then
            echo "::error::The files above have Windows (CRLF) line endings; bash inside WSL needs LF."
            exit 1
          fi

  powershell:
    name: PowerShell panel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The launcher uses powershell.exe (5.1), which rejects some syntax
      # PowerShell 7 accepts, so parse with 5.1 itself.
      - name: Parses with Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @(Get-ChildItem powershell, launcher -Recurse -Filter *.ps1) + @(Get-Item install.ps1)) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            $rel = Resolve-Path -Relative $f.FullName
            foreach ($e in $errors) { Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            if (-not $errors) { "Parsed OK: $rel" }
          }
          if ($bad) { exit 1 }
          "PowerShell $($PSVersionTable.PSVersion)"

      # 5.1 reads a BOM-less script as ANSI, so any non-ASCII byte can break it.
      - name: Scripts are plain ASCII
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @(Get-ChildItem powershell, launcher -Recurse -Include *.ps1, *.cs, *.xaml) + @(Get-Item install.ps1)) {
            $lines = [IO.File]::ReadAllLines($f.FullName)
            $rel = Resolve-Path -Relative $f.FullName
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '[^\x00-\x7F]') { Write-Host "::error file=$rel,line=$($i + 1)::Non-ASCII character"; $bad++ }
            }
          }
          if ($bad) { exit 1 }
          'Plain ASCII'

      # cmd.exe can fail to find labels in a .bat with Unix (LF) line endings.
      - name: Launcher keeps CRLF line endings
        shell: powershell
        run: |
          foreach ($bat in 'WSL-Control-Panel.bat', 'Install.bat') {
            $text = [IO.File]::ReadAllText((Resolve-Path $bat).Path)
            if ($text -match "(^|[^`r])`n") {
              Write-Host "::error file=$bat::Has LF-only line endings; it must be CRLF."
              exit 1
            }
          }
          'CRLF OK'

      # Builds the real window (XAML, every event handler, every dialog and the
      # background worker) without showing it.
      - name: Window builds
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File powershell/WSL-Control-Panel.ps1 -Validate
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The installer from this checkout: builds "WSL Control Panel.exe" with the
      # C# compiler that comes with Windows, an update keeps the data folder,
      # and the exe itself builds the window (no PowerShell window involved).
      - name: Installer and app
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'WSL Control Panel'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 -From . -InstallDir $dir -NoShortcuts -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Join-Path $dir 'WSL Control Panel.exe'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Host '::error::The app was not built.'; exit 1 }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WSLControlPanel')) { Write-Host '::error::No Settings > Apps entry.'; exit 1 }
          # Only what the app needs is installed.
          $installed = @(Get-ChildItem -LiteralPath $dir -Name | Where-Object { $_ -ne 'data' } | Sort-Object)
          "Installed: $($installed -join ', ')"
          if (($installed -join ',') -ne 'bash,install.ps1,powershell,WSL Control Panel.exe') { Write-Host '::error::Unexpected files in the install folder.'; exit 1 }

          New-Item -ItemType Directory -Force -Path (Join-Path $dir 'data\config') | Out-Null
          Set-Content -LiteralPath (Join-Path $dir 'data\config\keep.txt') -Value 'x'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 -From . -InstallDir $dir -NoShortcuts -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'data\config\keep.txt'))) { Write-Host '::error::An update deleted the data folder.'; exit 1 }

          $p = Start-Process -FilePath $exe -ArgumentList '--validate' -Wait -PassThru `
                 -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Get-Content app-out.txt, app-err.txt
          if ($p.ExitCode -ne 0) { Write-Host "::error::The app exited with $($p.ExitCode)."; exit 1 }
          if (-not (Select-String -Path app-out.txt -Pattern 'Window built' -Quiet)) { Write-Host '::error::The app did not build the window.'; exit 1 }
          (Get-Item -LiteralPath $exe).VersionInfo | Format-List FileDescription, ProductName

      # Report only: style findings are worth reading but do not fail the build.
      - name: PSScriptAnalyzer (report only)
        continue-on-error: true
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          Invoke-ScriptAnalyzer -Path powershell -Recurse -Severity Error, Warning |
            Format-Table Line, Severity, RuleName, Message -AutoSize -Wrap | Out-String -Width 220
