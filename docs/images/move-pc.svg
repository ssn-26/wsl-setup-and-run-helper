<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="900" height="230" rx="16" fill="#f5f7fb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8599"/></marker>
  </defs>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Back up once, bring it back anywhere</text>

  <g transform="translate(60,62)">
    <rect width="200" height="140" rx="14" fill="#ffffff" stroke="#d5dbe6"/>
    <rect x="50" y="18" width="100" height="62" rx="5" fill="#3d5a80"/>
    <rect x="36" y="80" width="128" height="8" rx="3" fill="#9aa5b8"/>
    <text x="100" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Old PC</text>
    <text x="100" y="131" text-anchor="middle" font-size="13" fill="#5b6475">press Back up</text>
  </g>
  <line x1="268" y1="132" x2="342" y2="132" stroke="#7a8599" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(350,62)">
