    <path d="M78 22h34l14 14v46h-48z" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
    <path d="M112 22v14h14" fill="none" stroke="#c9a227" stroke-width="2"/>
    <text x="100" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8a6d00">.tar</text>
    <text x="100" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">One backup file</text>
    <text x="100" y="131" text-anchor="middle" font-size="13" fill="#5b6475">USB stick or cloud</text>
  </g>
  <line x1="558" y1="132" x2="632" y2="132" stroke="#7a8599" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(640,62)">
    <rect width="200" height="140" rx="14" fill="#ffffff" stroke="#d5dbe6"/>
    <rect x="50" y="18" width="100" height="62" rx="5" fill="#1e8e3e"/>
