    <rect x="36" y="80" width="128" height="8" rx="3" fill="#9aa5b8"/>
    <text x="100" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">New PC</text>
    <text x="100" y="131" text-anchor="middle" font-size="13" fill="#5b6475">press Restore</text>
