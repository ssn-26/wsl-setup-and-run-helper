<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="900" height="300" rx="16" fill="#f5f7fb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8599"/></marker>
  </defs>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">How it works, in one picture</text>

  <!-- You -->
  <rect x="30" y="80" width="170" height="170" rx="14" fill="#ffffff" stroke="#d5dbe6"/>
  <circle cx="115" cy="125" r="22" fill="#cfe0f7"/>
  <path d="M75 190c6-28 74-28 80 0" fill="#cfe0f7"/>
  <text x="115" y="222" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">You</text>
  <text x="115" y="241" text-anchor="middle" font-size="13" fill="#5b6475">click a button</text>

  <line x1="205" y1="165" x2="258" y2="165" stroke="#7a8599" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Panel -->
  <rect x="265" y="80" width="190" height="170" rx="14" fill="#0b63ce"/>
  <rect x="290" y="105" width="140" height="80" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="300" y="115" width="40" height="60" rx="4" fill="#cfe0f7"/>
  <rect x="348" y="115" width="72" height="14" rx="4" fill="#0b63ce" opacity="0.8"/>
  <rect x="348" y="137" width="72" height="10" rx="3" fill="#d5dbe6"/>
  <rect x="348" y="153" width="50" height="10" rx="3" fill="#d5dbe6"/>
  <text x="360" y="215" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">WSL Control Panel</text>
  <text x="360" y="236" text-anchor="middle" font-size="13" fill="#dbe8fb">types the commands for you</text>

  <line x1="460" y1="165" x2="513" y2="165" stroke="#7a8599" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- WSL -->
  <rect x="520" y="80" width="150" height="170" rx="14" fill="#ffffff" stroke="#d5dbe6"/>
  <rect x="555" y="105" width="80" height="60" rx="6" fill="#1f2937"/>
  <text x="566" y="132" font-family="Consolas, monospace" font-size="14" fill="#7ee08a">$ wsl</text>
  <rect x="566" y="142" width="40" height="6" rx="2" fill="#7a8599"/>
  <text x="595" y="207" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">WSL</text>
  <text x="595" y="228" text-anchor="middle" font-size="13" fill="#5b6475">built into Windows</text>

  <line x1="675" y1="165" x2="728" y2="165" stroke="#7a8599" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Linux -->
  <rect x="735" y="80" width="140" height="170" rx="14" fill="#1e8e3e"/>
  <rect x="760" y="102" width="90" height="62" rx="6" fill="#ffffff" opacity="0.95"/>
  <rect x="760" y="156" width="90" height="8" rx="2" fill="#2b3a55"/>
  <circle cx="790" cy="128" r="9" fill="#ffcc4d"/>
  <rect x="805" y="122" width="34" height="12" rx="3" fill="#cfe0f7"/>
  <text x="805" y="194" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Linux</text>
  <text x="805" y="214" text-anchor="middle" font-size="13" fill="#d7f3de">desktop, terminal</text>
  <text x="805" y="231" text-anchor="middle" font-size="13" fill="#d7f3de">and apps</text>
</svg>
