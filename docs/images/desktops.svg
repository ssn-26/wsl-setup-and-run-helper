<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="900" height="260" rx="16" fill="#f5f7fb"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Pick the look you like</text>

  <!-- XFCE: top bar + bottom dock -->
  <g transform="translate(25,60)">
    <rect width="158" height="175" rx="12" fill="#ffffff" stroke="#d5dbe6"/>
    <rect x="14" y="14" width="130" height="84" rx="6" fill="#3d5a80"/>
    <rect x="14" y="14" width="130" height="10" rx="3" fill="#1f2937"/>
    <rect x="49" y="86" width="60" height="9" rx="4" fill="#e0e5ee"/>
    <rect x="34" y="36" width="60" height="38" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="79" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">XFCE</text>
    <text x="79" y="141" text-anchor="middle" font-size="12" fill="#5b6475">light, simple</text>
    <text x="79" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0b63ce">~500 MB (default)</text>
  </g>
  <!-- KDE: bottom taskbar -->
  <g transform="translate(196,60)">
    <rect width="158" height="175" rx="12" fill="#ffffff" stroke="#d5dbe6"/>
    <rect x="14" y="14" width="130" height="84" rx="6" fill="#4f6fa8"/>
    <rect x="14" y="86" width="130" height="12" rx="3" fill="#1f2937"/>
    <circle cx="24" cy="92" r="3.5" fill="#5fa8ff"/>
    <rect x="34" y="28" width="66" height="44" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="79" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">KDE Plasma</text>
    <text x="79" y="141" text-anchor="middle" font-size="12" fill="#5b6475">most like Windows</text>
    <text x="79" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0b63ce">~1.3 GB</text>
  </g>
  <!-- Cinnamon -->
  <g transform="translate(367,60)">
    <rect width="158" height="175" rx="12" fill="#ffffff" stroke="#d5dbe6"/>
    <rect x="14" y="14" width="130" height="84" rx="6" fill="#5c7a5c"/>
    <rect x="14" y="86" width="130" height="12" rx="3" fill="#2b2b2b"/>
    <rect x="18" y="89" width="14" height="6" rx="2" fill="#8bc34a"/>
    <rect x="40" y="30" width="62" height="42" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="79" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Cinnamon</text>
    <text x="79" y="141" text-anchor="middle" font-size="12" fill="#5b6475">friendly, Windows-ish</text>
    <text x="79" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0b63ce">~900 MB</text>
  </g>
  <!-- MATE: two bars -->
  <g transform="translate(538,60)">
    <rect width="158" height="175" rx="12" fill="#ffffff" stroke="#d5dbe6"/>
    <rect x="14" y="14" width="130" height="84" rx="6" fill="#6a8f4e"/>
    <rect x="14" y="14" width="130" height="9" rx="3" fill="#3a3a3a"/>
    <rect x="14" y="89" width="130" height="9" rx="3" fill="#3a3a3a"/>
    <rect x="36" y="34" width="60" height="40" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="79" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">MATE</text>
    <text x="79" y="141" text-anchor="middle" font-size="12" fill="#5b6475">classic, steady</text>
    <text x="79" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0b63ce">~800 MB</text>
  </g>
  <!-- LXQt -->
  <g transform="translate(709,60)">
    <rect width="166" height="175" rx="12" fill="#ffffff" stroke="#d5dbe6"/>
    <rect x="14" y="14" width="138" height="84" rx="6" fill="#2f6f8f"/>
    <rect x="14" y="88" width="138" height="10" rx="3" fill="#20303a"/>
    <rect x="34" y="30" width="62" height="42" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="83" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">LXQt</text>
    <text x="83" y="141" text-anchor="middle" font-size="12" fill="#5b6475">lightest, for old PCs</text>
    <text x="83" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0b63ce">~500 - 700 MB</text>
  </g>
</svg>
